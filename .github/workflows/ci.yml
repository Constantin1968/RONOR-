name: CI — Build, Test & Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Verify no uncommitted build output
        run: |
          if [ -d "dist" ]; then
            echo "Build output generated successfully"
          else
            echo "ERROR: Build did not produce dist/"
            exit 1
          fi

  test:
    name: Jest Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: Test summary
        if: always()
        run: echo "Tests completed"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=critical
      - name: Secrets scan
        run: |
          npx --yes @trufflesecurity/trufflehog@latest git \
            file://. \
            --only-verified \
            --fail
        continue-on-error: true

  automation-preflight:
    name: Automation Activation Preflight Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate activation preflight syntax
        run: bash -n scripts/automation-preflight.sh
      - name: Verify missing policy fails closed without side effects
        run: |
          set +e
          output="$(env -i PATH="$PATH" HOME="$HOME" bash scripts/automation-preflight.sh 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          test "$(printf '%s\n' "$output" | grep -c '^PASS  network\|^PREFLIGHT PASS')" -eq 0
          test "$(printf '%s\n' "$output" | grep -c 'set RONOR_AUTOMATION_SECRET_DIR')" -eq 1

  baseline-equivalence:
    name: Baseline Equivalence (R-Knowledge disabled)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Disabled-mode equivalence assertions
        run: npx jest tests/knowledge/equivalence.test.ts --runInBand

      - name: Runtime equivalence harness (boots both modes)
        env:
          OPENAI_API_KEY: placeholder
          RONOR_API_KEYS: equivalence:eq-harness-key-not-for-production
        run: |
          npm run build
          bash scripts/knowledge-equivalence.sh

      - name: Pre-existing corpus intact in isolation
        run: npx jest --testPathIgnorePatterns="tests/knowledge" --runInBand

      - name: Upload equivalence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equivalence-evidence
          path: evidence/knowledge/
          if-no-files-found: warn

  knowledge-conformance:
    name: R-Knowledge Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, baseline-equivalence]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Download fresh equivalence evidence
        uses: actions/download-artifact@v4
        with:
          name: equivalence-evidence
          path: evidence/knowledge

      - name: R-Knowledge test suites
        run: npx jest tests/knowledge --runInBand

      - name: Retrieval benchmark (release gate determines exit code)
        run: npx ts-node --transpile-only scripts/benchmark-retrieval.ts

      # Do NOT set RONOR_API_KEYS / AUDIT_DB_PATH here: CONF-5 re-runs the whole
      # suite and those vars change auth/bootstrap behaviour vs the green Jest Tests job.
      - name: Conformance verification
        id: verify
        run: npx ts-node --transpile-only scripts/verify-knowledge-conformance.ts

      - name: Report failed conformance checks on PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT=evidence/knowledge/conformance-report.json
          if [ ! -f "$REPORT" ]; then
            BODY="Conformance verification failed before writing conformance-report.json (verify outcome=${{ steps.verify.outcome }})."
          else
            BODY=$(python3 - <<'PY'
          import json
          r=json.load(open('evidence/knowledge/conformance-report.json'))
          lines=['## Conformance FAIL dump', f"Verdict: `{r.get('verdict')}`", '']
          for c in r.get('checks', []):
            if c.get('result')=='FAIL':
              lines.append(f"### {c.get('id')}: {c.get('description')}")
              lines.append('```json')
              lines.append(json.dumps(c.get('observed'), indent=2)[:3500])
              lines.append('```')
              lines.append('')
          if len(lines)==3:
            lines.append('_No FAIL checks in report (runner may have crashed)._')
          print('\n'.join(lines))
          PY
          )
          fi
          gh pr comment ${{ github.event.pull_request.number }} --body "$BODY"

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-evidence
          path: evidence/knowledge/
          if-no-files-found: warn
