services:
  agent:
    build: .
    image: energy-trading-agent:latest
    container_name: energy-trading-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ET_SCHEDULER_ENABLED: "true"
      ET_DATA_DIR: /app/data
      ET_STATE_DIR: /app/state
    volumes:
      - ./data:/app/data
      - agent-state:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  agent-state:
