# ============================================================================
# RONOR — nginx TLS edge
# ----------------------------------------------------------------------------
# The ONLY public listener in the deployment. RONOR itself binds to 127.0.0.1
# and never handles a private key.
#
# Mounted read-only into the nginx container as /etc/nginx/conf.d/default.conf
# under the `edge` compose profile. Replace ronor.example.com with the real
# hostname in both server blocks before first bring-up — certbot writes its
# certificate under the exact name requested, and a mismatch produces an nginx
# that refuses to start rather than one that serves the wrong cert.
#
# Prepared by AMB · Mayleven Ecosystem
# ============================================================================

# --------------------------------------------------------------------------
# Rate limiting zones
# --------------------------------------------------------------------------
#
# Two tiers, because the endpoints have genuinely different cost profiles. A
# governed query invokes a frontier model and costs real money; a status read
# costs nothing. One shared limit would either throttle a dashboard or leave the
# expensive path open.
limit_req_zone $binary_remote_addr zone=ronor_query:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=ronor_read:10m   rate=120r/m;
limit_req_zone $binary_remote_addr zone=ronor_global:10m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=ronor_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# --------------------------------------------------------------------------
# Upstream
# --------------------------------------------------------------------------
upstream ronor_runtime {
    server ronor:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# --------------------------------------------------------------------------
# Port 80 — ACME challenge and redirect ONLY
# --------------------------------------------------------------------------
#
# Nothing is proxied over plaintext. A governed query carrying INTERNAL material
# must not traverse an unencrypted hop, and an http listener that quietly works
# is one that clients will keep using.
server {
    listen 80;
    listen [::]:80;
    server_name ronor.example.com;

    # The webroot certbot writes its challenge into. Must be reachable before the
    # first certificate exists, which is why this block does not require TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Container-local liveness for the nginx healthcheck. Answered by nginx
    # itself, so it reports the edge rather than the upstream.
    location = /healthz {
        access_log off;
        return 200 "edge-ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------
# Port 443 — the governed surface
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ronor.example.com;

    ssl_certificate     /etc/letsencrypt/live/ronor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ronor.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ronor.example.com/chain.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # ----------------------------------------------------------------------
    # Security headers
    # ----------------------------------------------------------------------
    #
    # HSTS without preload and without includeSubDomains. Preload is effectively
    # irreversible and should be a deliberate, separate decision; asserting it in
    # a template commits a domain the template's author does not own.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # The operator console is served from the same origin and uses inline styles.
    # 'unsafe-inline' for style-src is therefore honest rather than aspirational;
    # script-src stays strict.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Nginx version suppressed — it names a patch level to anyone who asks.
    server_tokens off;

    # A governed query with retrieval and a fallback attempt can legitimately run
    # for minutes. RUNTIME_PROVIDER_TIMEOUT_MS defaults to 120s and the runtime
    # may try up to three engines, so the edge must outlast the application's own
    # ceiling. An edge that times out first turns a slow-but-successful request
    # into a 504 the ledger records as spend with no answer delivered.
    proxy_connect_timeout 10s;
    proxy_send_timeout    420s;
    proxy_read_timeout    420s;
    send_timeout          420s;

    client_max_body_size 12m;   # matches express.json({ limit: '10mb' }) plus overhead
    client_body_timeout  60s;

    limit_conn ronor_conn 24;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # Buffering off: responses are single JSON documents, and the console reads
    # them as they arrive. Buffering adds latency for no benefit here.
    proxy_buffering off;
    proxy_request_buffering on;

    # ----------------------------------------------------------------------
    # Health — unauthenticated by design, and the ONE route allowed to be
    # polled hard. Access logging off so a 30s probe does not fill the disk
    # with lines nobody reads.
    # ----------------------------------------------------------------------
    location = /api/runtime/health {
        access_log off;
        limit_req zone=ronor_read burst=20 nodelay;
        proxy_pass http://ronor_runtime;
    }

    location = /healthz {
        access_log off;
        return 200 "edge-ok\n";
    }

    # ----------------------------------------------------------------------
    # Expensive, model-invoking endpoints — tight limit
    # ----------------------------------------------------------------------
    location ~ ^/api/runtime/(query|agents/dispatch|knowledge/ingest)$ {
        limit_req zone=ronor_query burst=5 nodelay;
        proxy_pass http://ronor_runtime;
    }

    # ----------------------------------------------------------------------
    # Key administration — reachable over the tailnet ONLY
    # ----------------------------------------------------------------------
    #
    # The route that mints and revokes API keys is not published to the internet
    # even behind a bearer token. An admin surface exposed publicly is one
    # credential away from total compromise, and the tailnet already
    # authenticates every device on it by key.
    location ^~ /api/runtime/admin/ {
        allow 100.64.0.0/10;   # Tailscale CGNAT range
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://ronor_runtime;
    }

    # ----------------------------------------------------------------------
    # Operator console — tailnet only, for the same reason
    # ----------------------------------------------------------------------
    location ^~ /console {
        allow 100.64.0.0/10;
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://ronor_runtime;
    }

    # ----------------------------------------------------------------------
    # Everything else on the governed surface
    # ----------------------------------------------------------------------
    location /api/ {
        limit_req zone=ronor_read burst=40 nodelay;
        proxy_pass http://ronor_runtime;
    }

    # ----------------------------------------------------------------------
    # Telegram webhook (only when TELEGRAM_MODE=webhook)
    # ----------------------------------------------------------------------
    #
    # Telegram's own address ranges only. The bot also verifies the
    # X-Telegram-Bot-Api-Secret-Token header, so this is defence in depth rather
    # than the sole control — but an open webhook path is a free injection point
    # into the operator channel and should not exist.
    location ^~ /telegram/webhook/ {
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        deny  all;
        limit_req zone=ronor_global burst=30 nodelay;
        proxy_pass http://ronor_runtime;
    }

    # Static landing page and anything else the runtime serves.
    location / {
        limit_req zone=ronor_global burst=60 nodelay;
        proxy_pass http://ronor_runtime;
    }

    # A 502 from the edge means the runtime is down or restarting. Answered as
    # JSON because every client of this surface speaks JSON, and an HTML error
    # page breaks their parser at precisely the moment they need to read the
    # reason.
    error_page 502 503 504 = @upstream_down;
    location @upstream_down {
        default_type application/json;
        return 503 '{"ok":false,"error":"runtime_unavailable","message":"The RONOR runtime is not answering. It may be restarting or degraded.","edge":"nginx"}';
    }
}
