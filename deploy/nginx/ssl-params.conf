# ============================================================================
# RONOR — shared TLS parameters
# ----------------------------------------------------------------------------
# Mounted read-only at /etc/nginx/snippets/ssl-params.conf.
#
# TLS 1.2 and 1.3 only. TLS 1.0/1.1 are withdrawn and 1.2 is retained solely
# because some corporate egress proxies still terminate at it; dropping it would
# make the runtime unreachable from networks the operator does not control.
#
# Prepared by AMB · Mayleven Ecosystem
# ============================================================================

ssl_protocols TLSv1.2 TLSv1.3;

# AEAD suites only, forward-secret only. Ordered by preference; the server's
# order is honoured for 1.2 (for 1.3 nginx defers to the client, which is correct
# — every 1.3 suite here is acceptable).
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers on;

ssl_ecdh_curve X25519:secp384r1;

# Session resumption via cache, NOT tickets. A ticket key that lives for the
# lifetime of the process undermines forward secrecy for every session it can
# decrypt; the shared cache keeps the state server-side where it can be dropped.
ssl_session_cache shared:RONOR_TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling. The resolver is Docker's embedded DNS, which is what the
# container actually has; a public resolver here would be an unnecessary egress
# dependency for a certificate status lookup.
ssl_stapling on;
ssl_stapling_verify on;
resolver 127.0.0.11 valid=300s ipv6=off;
resolver_timeout 5s;

# Buffer sized to fit a typical JSON response inside a single TLS record, so the
# first byte reaches the client without waiting for a 16 KB record to fill.
ssl_buffer_size 4k;
