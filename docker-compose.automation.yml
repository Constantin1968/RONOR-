name: ronor-automation

# Opt-in development automation plane. This file is deliberately separate from
# the production stack and publishes only loopback control ports. It neither
# mounts the Docker socket nor receives SSH/GitHub credentials.
x-ronor-service: &ronor-service
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  image: ronor-automation:${RONOR_AUTOMATION_IMAGE_TAG:-local}
  user: "10001:10001"
  read_only: true
  init: true
  restart: "no"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 512m
  cpus: 1.0
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m
  networks: [automation-control]

services:
  langgraph:
    <<: *ronor-service
    command: [node, dist/runtime/automation/services/langgraph-local.js]
    environment:
      RONOR_LANGGRAPH_HOST: 0.0.0.0
      RONOR_LANGGRAPH_PORT: "2024"
      RONOR_LANGGRAPH_TOKEN_FILE: /run/secrets/langgraph_token
    secrets: [langgraph_token]
    ports: ["127.0.0.1:${RONOR_AUTOMATION_LANGGRAPH_HOST_PORT:-2024}:2024"]
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs'),http=require('http');const t=fs.readFileSync('/run/secrets/langgraph_token','utf8').trim();http.get({host:'127.0.0.1',port:2024,path:'/health',headers:{authorization:'Bearer '+t}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12

  model-egress-proxy:
    <<: *ronor-service
    command: [node, dist/runtime/automation/services/model-egress-proxy-server.js]
    environment:
      RONOR_MODEL_EGRESS_HOST: 0.0.0.0
      RONOR_MODEL_EGRESS_PORT: "3004"
      RONOR_MODEL_GATEWAY_BASE_URL: ${RONOR_MODEL_GATEWAY_BASE_URL:?set the approved HTTPS model gateway in .env.automation}
      RONOR_MODEL_GATEWAY_ALLOW_TAILSCALE: ${RONOR_MODEL_GATEWAY_ALLOW_TAILSCALE:-false}
      RONOR_MODEL_GATEWAY_OPENHANDS_TOKEN_FILE: /run/secrets/openhands_llm_api_key
      RONOR_MODEL_GATEWAY_CODEX_TOKEN_FILE: /run/secrets/codex_api_key
      RONOR_MODEL_GATEWAY_UPSTREAM_TOKEN_FILE: /run/secrets/model_gateway_upstream_token
    secrets: [openhands_llm_api_key, codex_api_key, model_gateway_upstream_token]
    networks: [model-egress, model-uplink]
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs'),http=require('http');const t=fs.readFileSync('/run/secrets/openhands_llm_api_key','utf8').trim();http.get({host:'127.0.0.1',port:3004,path:'/health',headers:{authorization:'Bearer '+t}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12

  openhands-agent:
    build:
      context: .
      dockerfile: Dockerfile.openhands-agent
      args:
        RONOR_OPENHANDS_AGENT_IMAGE: ghcr.io/openhands/agent-server:1.42.1-python
    image: ronor-openhands-agent:${RONOR_AUTOMATION_IMAGE_TAG:-local}
    user: "10001:10001"
    read_only: true
    init: true
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    tmpfs:
      # The pinned Agent Server is a PyInstaller binary and must execute its
      # unpacked native libraries from /tmp. The root filesystem remains RO.
      - /tmp:rw,exec,nosuid,nodev,size=512m
      # Conversation state is ephemeral and intentionally excluded from the
      # repository worktree. Evidence is exported separately before teardown.
      - /workspace/conversations:rw,nosuid,nodev,size=1g
    command: [--host, 0.0.0.0, --port, "8000"]
    environment:
      HOME: /tmp/openhands-home
      XDG_CONFIG_HOME: /tmp/openhands-config
      LLM_MODEL: ${RONOR_OPENHANDS_LLM_MODEL:?set in .env.automation}
      LLM_BASE_URL: http://model-egress-proxy:3004/v1
      RONOR_OPENHANDS_SESSION_API_KEY_FILE: /run/secrets/openhands_session_key
      RONOR_OPENHANDS_LLM_API_KEY_FILE: /run/secrets/openhands_llm_api_key
      RONOR_OPENHANDS_SECRET_KEY_FILE: /run/secrets/openhands_secret_key
    secrets: [openhands_session_key, openhands_llm_api_key, openhands_secret_key]
    depends_on:
      model-egress-proxy:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${RONOR_AUTOMATION_WORKTREE:?absolute dedicated worktree required}
        target: /workspace/project
        read_only: false
    networks: [automation-control, model-egress]
    healthcheck:
      test: [CMD, python, -c, "import pathlib,urllib.request; t=pathlib.Path('/run/secrets/openhands_session_key').read_text().strip(); r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health',headers={'X-Session-API-Key':t}),timeout=3); raise SystemExit(0 if r.status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 18

  openhands-bridge:
    <<: *ronor-service
    command: [node, dist/runtime/automation/services/openhands-bridge-server.js]
    depends_on:
      openhands-agent:
        condition: service_healthy
    environment:
      RONOR_OPENHANDS_AGENT_SERVER_URL: http://openhands-agent:8000
      RONOR_OPENHANDS_BRIDGE_HOST: 0.0.0.0
      RONOR_OPENHANDS_BRIDGE_PORT: "3001"
      RONOR_OPENHANDS_NONCE_DIR: /var/lib/ronor-nonces
      RONOR_OPENHANDS_SESSION_API_KEY_FILE: /run/secrets/openhands_session_key
      RONOR_OPENHANDS_LLM_MODEL: ${RONOR_OPENHANDS_LLM_MODEL:?set in .env.automation}
      RONOR_OPENHANDS_LLM_BASE_URL: http://model-egress-proxy:3004/v1
      RONOR_OPENHANDS_LLM_API_KEY_FILE: /run/secrets/openhands_llm_api_key
      RONOR_OPENHANDS_BRIDGE_TOKEN_FILE: /run/secrets/openhands_bridge_token
      RONOR_AUTOMATION_CAPABILITY_KEY_FILE: /run/secrets/automation_capability_key
    secrets: [openhands_session_key, openhands_llm_api_key, openhands_bridge_token, automation_capability_key]
    volumes:
      - type: bind
        source: ${RONOR_AUTOMATION_NONCE_DIR:?absolute pre-created nonce directory required}
        target: /var/lib/ronor-nonces
        read_only: false
    ports: ["127.0.0.1:${RONOR_AUTOMATION_OPENHANDS_BRIDGE_HOST_PORT:-3001}:3001"]
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs'),http=require('http');const t=fs.readFileSync('/run/secrets/openhands_bridge_token','utf8').trim();http.get({host:'127.0.0.1',port:3001,path:'/health',headers:{authorization:'Bearer '+t}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12

  codex-verifier:
    <<: *ronor-service
    command: [node, dist/runtime/automation/services/verification-authorities-server.js, codex]
    environment:
      RONOR_AUTHORITY_HOST: 0.0.0.0
      RONOR_CODEX_VERIFIER_PORT: "3002"
      RONOR_AUTOMATION_ARTIFACT_ROOT: /artifacts
      RONOR_CODEX_VERIFIER_TOKEN_FILE: /run/secrets/codex_verifier_token
      RONOR_CODEX_RECEIPT_PRIVATE_KEY_FILE: /run/secrets/codex_receipt_private_key
      RONOR_CODEX_API_KEY_FILE: /run/secrets/codex_api_key
      RONOR_CODEX_MODEL: ${RONOR_CODEX_MODEL:?set in .env.automation}
      RONOR_CODEX_BASE_URL: http://model-egress-proxy:3004/v1
      RONOR_CODEX_INPUT_USD_PER_MTOK: ${RONOR_CODEX_INPUT_USD_PER_MTOK:?set current rate}
      RONOR_CODEX_OUTPUT_USD_PER_MTOK: ${RONOR_CODEX_OUTPUT_USD_PER_MTOK:?set current rate}
    secrets: [codex_verifier_token, codex_api_key, codex_receipt_private_key]
    depends_on:
      model-egress-proxy:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${RONOR_AUTOMATION_ARTIFACT_ROOT:?absolute artifact root required}
        target: /artifacts
        read_only: true
    networks: [automation-control, model-egress]
    ports: ["127.0.0.1:${RONOR_AUTOMATION_CODEX_VERIFIER_HOST_PORT:-3002}:3002"]
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs'),http=require('http');const t=fs.readFileSync('/run/secrets/codex_verifier_token','utf8').trim();http.get({host:'127.0.0.1',port:3002,path:'/health',headers:{authorization:'Bearer '+t}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12

  victoria-assurance:
    <<: *ronor-service
    command: [node, dist/runtime/automation/services/verification-authorities-server.js, assurance]
    environment:
      RONOR_AUTHORITY_HOST: 0.0.0.0
      RONOR_ASSURANCE_PORT: "3003"
      RONOR_AUTOMATION_ARTIFACT_ROOT: /artifacts
      RONOR_ASSURANCE_TOKEN_FILE: /run/secrets/assurance_token
      RONOR_ASSURANCE_RECEIPT_PUBLIC_KEY_FILE: /run/secrets/assurance_receipt_public_key
    secrets: [assurance_token, assurance_receipt_public_key]
    volumes:
      - type: bind
        source: ${RONOR_AUTOMATION_ARTIFACT_ROOT:?absolute artifact root required}
        target: /artifacts
        read_only: true
    ports: ["127.0.0.1:${RONOR_AUTOMATION_ASSURANCE_HOST_PORT:-3003}:3003"]
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs'),http=require('http');const t=fs.readFileSync('/run/secrets/assurance_token','utf8').trim();http.get({host:'127.0.0.1',port:3003,path:'/health',headers:{authorization:'Bearer '+t}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12

  automation-evidence-runner:
    build:
      context: .
      dockerfile: Dockerfile.evidence-runner
    image: ronor-evidence-runner:${RONOR_AUTOMATION_IMAGE_TAG:-local}
    user: "10001:10001"
    read_only: true
    init: true
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    environment:
      RONOR_EVIDENCE_WORKSPACE: /workspace/project
      RONOR_AUTOMATION_ARTIFACT_ROOT: /artifacts
      RONOR_AUTOMATION_TEST_COMMANDS_JSON: ${RONOR_AUTOMATION_TEST_COMMANDS_JSON:?bounded test commands required}
      RONOR_EVIDENCE_RUNNER_TOKEN_FILE: /run/secrets/evidence_runner_token
      # Tests exercise the audit ledger; keep their database ephemeral while
      # preserving the read-only repository and root filesystem.
      AUDIT_DB_PATH: /tmp/ronor-automation-test-audit.sqlite
    secrets: [evidence_runner_token]
    volumes:
      - type: bind
        source: ${RONOR_AUTOMATION_WORKTREE:?absolute dedicated worktree required}
        target: /workspace/project
        read_only: true
      - type: bind
        source: ${RONOR_AUTOMATION_ARTIFACT_ROOT:?absolute artifact root required}
        target: /artifacts
        read_only: false
    networks: [automation-control]
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs'),http=require('http');const t=fs.readFileSync('/run/secrets/evidence_runner_token','utf8').trim();http.get({host:'127.0.0.1',port:3005,path:'/health',headers:{authorization:'Bearer '+t}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12

networks:
  automation-control:
    name: ronor-automation-control
    external: true
  # Must be a pre-created, firewall-restricted network reaching only the
  # approved model gateway. Compose will fail rather than create broad egress.
  model-egress:
    name: ronor-model-egress
    external: true
  # Only the narrow reverse proxy is dual-homed. Agent containers never join
  # this network and therefore have no general Internet route.
  model-uplink:
    name: ronor-model-uplink
    external: true

secrets:
  langgraph_token:
    file: ${RONOR_AUTOMATION_SECRET_DIR:?secret directory required}/langgraph_token
  openhands_session_key:
    file: ${RONOR_AUTOMATION_SECRET_DIR:?secret directory required}/openhands_session_key
  openhands_llm_api_key:
    file: ${RONOR_AUTOMATION_SECRET_DIR:?secret directory required}/openhands_llm_api_key
  openhands_secret_key:
    file: ${RONOR_AUTOMATION_SECRET_DIR:?secret directory required}/openhands_secret_key
  openhands_bridge_token:
    file: ${RONOR_AUTOMATION_SECRET_DIR:?secret directory required}/openhands_bridge_token
  automation_capability_key:
    file: ${RONOR_AUTOMATION_SECRET_DIR:?secret directory required}/automation_capability_key
  codex_verifier_token:
    file: ${RONOR_AUTOMATION_SECRET_DIR:?secret directory required}/codex_verifier_token
  codex_api_key:
    file: ${RONOR_AUTOMATION_SECRET_DIR:?secret directory required}/codex_api_key
  model_gateway_upstream_token:
    file: ${RONOR_AUTOMATION_SECRET_DIR:?secret directory required}/model_gateway_upstream_token
  assurance_token:
    file: ${RONOR_AUTOMATION_SECRET_DIR:?secret directory required}/assurance_token
  codex_receipt_private_key:
    file: ${RONOR_AUTOMATION_SECRET_DIR:?secret directory required}/codex_receipt_private_key
  assurance_receipt_public_key:
    file: ${RONOR_AUTOMATION_SECRET_DIR:?secret directory required}/assurance_receipt_public_key
  evidence_runner_token:
    file: ${RONOR_AUTOMATION_SECRET_DIR:?secret directory required}/evidence_runner_token
