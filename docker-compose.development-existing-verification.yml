# Opt-in overlay, LAST after the installed development-only Compose files.
# Never apply to the business runtime. Build/recreate only the three named services.
# Keep the installed mounts, identities, networks and restart policy unchanged.
services:
  controller:
    build:
      context: ${RONOR_EXISTING_VERIFY_SOURCE:?absolute reviewed source directory}
      dockerfile: Dockerfile.development-tools
      target: development-controller
    image: ronor-development-controller:${RONOR_EXISTING_VERIFY_TAG:?reviewed source commit}
    environment:
      RONOR_AUTOMATION_EXPECTED_HEAD: ${RONOR_EXISTING_VERIFY_HEAD:?exact approved candidate commit}
      # Read-only settlement of the model budget, for a run that ended without
      # reporting its cost. The controller holds no model gateway client token,
      # so joining this network grants it the signed ledger read alone and no
      # provider access; it stays off the uplink network and has no Internet route.
      RONOR_MODEL_EGRESS_URL: http://model-egress-proxy:3004
    networks: [automation-control, model-egress]
  openhands-bridge:
    build:
      context: ${RONOR_EXISTING_VERIFY_SOURCE:?absolute reviewed source directory}
      dockerfile: Dockerfile.development-tools
      target: runtime
    image: ronor-development-bridge:${RONOR_EXISTING_VERIFY_TAG:?reviewed source commit}
  automation-evidence-runner:
    build:
      context: ${RONOR_EXISTING_VERIFY_SOURCE:?absolute reviewed source directory}
      dockerfile: Dockerfile.development-tools
      target: evidence
    image: ronor-development-evidence:${RONOR_EXISTING_VERIFY_TAG:?reviewed source commit}
    environment:
      RONOR_AUTOMATION_EXPECTED_HEAD: ${RONOR_EXISTING_VERIFY_HEAD:?exact approved candidate commit}
