# ============================================================================
# RONOR — Sovereign Intelligence Operating Runtime
# Production composition: RONOR + Qdrant + Redis (+ optional nginx TLS edge)
# ----------------------------------------------------------------------------
# Target: a single Ubuntu 22.04 host (DigitalOcean 2 GB / 1 vCPU, ~$12/month).
#
# Bring-up:
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d --build
#
# What this file deliberately does NOT do
# ---------------------------------------
#   · It does not run Postgres. Durable relational state lives in Supabase
#     (managed Postgres, PITR, off-host). A local Postgres on a single droplet
#     is a single point of loss dressed as durability — one lost volume and the
#     conversation history, the mission log and the audit trail go with it.
#   · It does not publish Qdrant or Redis on a public interface. Both bind to
#     127.0.0.1 only. A vector store holding INTERNAL-classified material and a
#     queue holding pending approvals are not internet-facing services, and a
#     firewall is the second line of that defence, not the first.
#   · It does not terminate TLS in the application. Nginx does, under the `edge`
#     profile, so the runtime never handles a private key.
#
# Verification status (stated honestly)
# -------------------------------------
#   Authored and reviewed, NOT exercised against a running Docker daemon —
#   no server exists yet per the standing directive. Every service, port,
#   healthcheck and volume is derived from the repository's existing
#   docker-compose.yml, which was itself verified in the Build Week deploy.
#
# Cerința PKI (TLS pentru Qdrant)
# -------------------------------
#   Planul de cunoaștere refuză un punct final Qdrant în clar, deci Qdrant
#   rulează cu TLS. Fișierele de mai jos NU sunt create de nicio rețetă din
#   depozit; trebuie să existe pe gazdă înainte de `up`:
#     · /etc/ronor/pki/ca.crt     — certificatul autorității interne (public),
#                                   montat în runtime ca NODE_EXTRA_CA_CERTS;
#     · /etc/ronor/pki/qdrant.crt — certificatul serverului Qdrant, emis de
#                                   autoritatea internă; SAN trebuie să conțină
#                                   `qdrant` (numele serviciului) și, dacă se
#                                   folosesc clienți de pe gazdă, `localhost`
#                                   și `127.0.0.1`;
#     · /etc/ronor/pki/qdrant.key — cheia privată a serverului Qdrant.
#   Cheia privată a autorității interne nu se ține în /etc/ronor/pki și nu se
#   montează în niciun container. Certificatul se emite de operator, cu
#   autoritatea internă, în afara acestui fișier; la reînnoire se înlocuiesc
#   qdrant.crt și qdrant.key pe gazdă și se repornește serviciul `qdrant`.
#   Dacă fișierele lipsesc, Docker creează în locul lor directoare goale, iar
#   Qdrant nu pornește: verificați-le înainte de `up`.
#   Clienții de pe gazdă trebuie să folosească https://127.0.0.1:6333 și să
#   aibă încredere în ca.crt; http:// nu mai funcționează.
#
# Prepared by AMB · Mayleven Ecosystem
# ============================================================================

name: ronor-sovereign

x-logging: &default-logging
  # Bounded logs. An unbounded json-file driver on a 25 GB droplet volume is a
  # disk-full outage with a delay fuse.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # --------------------------------------------------------------------------
  # RONOR runtime — L0 HTTP surface through L7 ledgers
  # --------------------------------------------------------------------------
  ronor:
    build:
      context: .
      dockerfile: Dockerfile
    image: ronor:${RONOR_VERSION:-0.5.0}
    container_name: ronor-runtime
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      # Audit chain + local knowledge SQLite live on a named volume, not in the
      # container layer. A hash chain that vanishes on `docker compose down` is
      # not an audit chain.
      AUDIT_DB_PATH: /app/data/audit.db
      MI9_POLICY_PATH: /app/src/governance/policies.yaml
      KNOWLEDGE_SQLITE_PATH: /app/data/knowledge.db
      KNOWLEDGE_QUARANTINE_PATH: /app/data/knowledge-quarantine.jsonl
      # Service discovery inside the compose network. These override any host
      # value in .env.production on purpose: the container cannot reach the
      # host's 127.0.0.1.
      KNOWLEDGE_QDRANT_ENDPOINT: https://qdrant:6333
      NODE_EXTRA_CA_CERTS: /etc/ssl/ronor-ca.crt
      QDRANT_URL: https://qdrant:6333
      # Password is interpolated from REDIS_PASSWORD so the runtime can
      # authenticate. The URL form redis://:password@host is the standard
      # Redis URI scheme; the colon before the password is required when
      # there is no username.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      # Bound to loopback. Public exposure is nginx's job (profile `edge`).
      # If you deliberately run without the edge, change this to "3000:3000"
      # knowingly — it publishes an unencrypted API to the internet.
      - "127.0.0.1:3000:3000"
    volumes:
      - ronor-data:/app/data
      # Bind-mount: policy changes on the host take effect on next container restart
      - ./src/governance/policies.yaml:/app/src/governance/policies.yaml:ro
      # Trust anchor for the internal authority that signed the store
      # certificate. Verification cannot be disabled, so the runtime must
      # trust the issuer rather than skip the check.
      - /etc/ronor/pki/ca.crt:/etc/ssl/ronor-ca.crt:ro
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Probes /api/runtime/health, NOT /health.
      #
      # /health answers 200 as soon as Express is listening. /api/runtime/health
      # answers 200 only when a GENERATIVE provider is actually reachable, and
      # 503 with status=degraded otherwise. A container that is listening but
      # cannot reach any engine will accept traffic and fail every request; a
      # probe that calls that healthy hides the outage it exists to surface.
      test:
        - CMD
        - node
        - -e
        - |
          require('http').get('http://127.0.0.1:3000/api/runtime/health', r => {
            let b = '';
            r.on('data', c => (b += c));
            r.on('end', () => {
              try {
                const j = JSON.parse(b);
                process.exit(r.statusCode === 200 && j.status === 'ready' ? 0 : 1);
              } catch (e) { process.exit(1); }
            });
          }).on('error', () => process.exit(1));
      interval: 30s
      timeout: 10s
      # 40s, not 15s. Boot loads the MI9 policy, opens the audit chain, seeds
      # API keys, calibrates the router from persisted attempts and initialises
      # nine planes. Measured cold start is ~12s; a start_period that expires
      # mid-boot makes the orchestrator restart a container that was about to
      # become healthy — a crash loop caused entirely by the probe.
      start_period: 40s
      retries: 3
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          # Node + better-sqlite3 + nine planes sit comfortably under 1 GB. The
          # limit exists so that a runaway request cannot starve Qdrant and take
          # the whole host down with it.
          memory: 1024M

  # --------------------------------------------------------------------------
  # Qdrant — R-Knowledge production vector store
  # --------------------------------------------------------------------------
  #
  # Version PINNED, not `latest`. The directive named qdrant/qdrant:latest;
  # src/planes/r-knowledge/config.ts pins server v1.18.3 against client 1.18.0
  # and the conformance suite asserts that pin. A floating `latest` tag means the
  # store can change protocol under a client that was verified against a
  # specific version — silently, on a routine `docker compose pull`. The pinned
  # tag is the same software, minus that failure mode.
  qdrant:
    # v1.18.3 is the real latest stable release as of 2026-08-03
    # (verified against Docker Hub; no v1.19+ exists yet).
    # The @qdrant/js-client-rest 1.18.0 package in package.json was
    # written against this server version; they must stay in sync.
    image: qdrant/qdrant:v1.18.3
    container_name: ronor-qdrant
    environment:
      # Telemetry off. This is a server-side setting, which is why it belongs
      # here rather than in application code that cannot assert it.
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__SERVICE__API_KEY: ${KNOWLEDGE_QDRANT_API_KEY:?KNOWLEDGE_QDRANT_API_KEY must be set}
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-INFO}
      QDRANT__SERVICE__ENABLE_CORS: "false"
      # TLS is mandatory for the knowledge plane and not configurable there:
      # a plaintext endpoint is refused at parse time. Certificate issued by
      # the internal authority at /etc/ronor/pki, SAN covers the service name.
      QDRANT__SERVICE__ENABLE_TLS: "true"
      QDRANT__TLS__CERT: /qdrant/tls/qdrant.crt
      QDRANT__TLS__KEY: /qdrant/tls/qdrant.key
    ports:
      # 6333 REST, 6334 gRPC — loopback only.
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
      # Numai certificatul și cheia serverului, fișier cu fișier. Directorul
      # /etc/ronor/pki nu se montează întreg: dacă acolo se află și cheia
      # privată a autorității interne, Qdrant nu trebuie să o vadă.
      - /etc/ronor/pki/qdrant.crt:/qdrant/tls/qdrant.crt:ro
      - /etc/ronor/pki/qdrant.key:/qdrant/tls/qdrant.key:ro
    healthcheck:
      # A TCP probe rather than HTTP: the image ships no curl, and with an API
      # key set an unauthenticated HTTP probe returns 401 and reads as
      # unhealthy — a check that fails precisely when the server is correctly
      # secured is worse than none.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768M

  # --------------------------------------------------------------------------
  # Redis — approval-gate state, idempotency keys, rate-limit counters
  # --------------------------------------------------------------------------
  #
  # This is the shared store the in-process rate limiter cannot be. It also
  # holds pending Gate 1/2 approvals with a TTL, so a co-sign request that is
  # never answered EXPIRES rather than remaining actionable indefinitely.
  #
  # Persistence is on (appendonly). Losing the pending-approval set on restart
  # would silently drop human-in-the-loop decisions.
  redis:
    image: redis:7-alpine
    container_name: ronor-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 320M

  # --------------------------------------------------------------------------
  # Telegram bridge — sovereign operator interface (L0 side-channel)
  # --------------------------------------------------------------------------
  #
  # Runs as a SEPARATE container from the same image. Two reasons, both
  # operational: a bot that crashes on a malformed update must not take the
  # governed API down with it, and long-polling Telegram is a blocking I/O
  # workload that does not belong in the request path.
  #
  # Profile `telegram` — it starts only when a token exists. A bot container
  # restart-looping on an absent token is noise that masks real failures.
  telegram:
    image: ronor:${RONOR_VERSION:-0.5.0}
    container_name: ronor-telegram
    profiles: ["telegram"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # Talks to the runtime over the compose network, never over the internet.
      # The operator interface and the runtime share a host; routing their
      # traffic through the public edge would expose an internal call path and
      # add a TLS handshake to every message for no security gain.
      RONOR_API_BASE_URL: http://ronor:3000
    command: ["node", "dist/interfaces/telegram/index.js"]
    depends_on:
      ronor:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M

  # --------------------------------------------------------------------------
  # Energy Trading Arm — the crossborder electricity module
  # --------------------------------------------------------------------------
  #
  # Runs the Muse-authored energy_trading Python package (handover v0.2.0,
  # 127 pytest cases green) as a permanent RONOR service on the internal docker
  # network. Reachable only from the compose network at http://energy-trading-arm:8000.
  # All calls are authenticated with X-RONOR-Token (value from ET_API_TOKEN).
  #
  # Profile `energy-trading`, because the arm is not needed on droplets that do
  # not host trading operations. Enabled with:
  #
  #   docker compose -f docker-compose.production.yml --profile energy-trading up -d
  #
  # or via ./deploy/deploy.sh --with-energy-trading.
  energy-trading-arm:
    build:
      context: ./services/energy-trading-arm
      dockerfile: Dockerfile
    image: ronor-energy-trading-arm:${RONOR_ENERGY_TRADING_VERSION:-0.2.0}
    container_name: ronor-energy-trading-arm
    profiles: ["energy-trading"]
    env_file:
      - .env.production
    environment:
      # The arm is a self-contained FastAPI service. It stores data in mounted
      # volumes, not in ephemeral container state, so scheduled jobs survive
      # a container restart. Timezone stays Europe/Bucharest to match the
      # operator sheets Muse designed the twin around.
      ET_TIMEZONE: Europe/Bucharest
      ET_HOME_ZONE: RO
      ET_DATA_DIR: /app/data
      ET_STATE_DIR: /app/state
      ET_SCHEDULER_ENABLED: "true"
      # The runtime bridges here through the internal docker DNS, not the
      # public internet. The token is required and validated by every
      # authenticated route on the FastAPI side (X-RONOR-Token header).
    volumes:
      - energy-trading-data:/app/data
      - energy-trading-state:/app/state
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # --------------------------------------------------------------------------
  # Nginx — TLS termination and the only public listener
  # --------------------------------------------------------------------------
  #
  # Profile `edge`, because a droplet reached exclusively over Tailscale needs
  # no public listener at all, and starting one anyway would widen the attack
  # surface to serve a use case that deployment does not have.
  #
  #   docker compose -f docker-compose.production.yml --profile edge up -d
  nginx:
    image: nginx:1.27-alpine
    container_name: ronor-nginx
    profiles: ["edge"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/ronor.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/ssl-params.conf:/etc/nginx/snippets/ssl-params.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - ronor
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  # --------------------------------------------------------------------------
  # Certbot — certificate issuance and renewal
  # --------------------------------------------------------------------------
  #
  # Renews every 12 hours and exits between attempts. Let's Encrypt certificates
  # last 90 days; a renewal that runs only on deploy is a certificate that
  # expires during the first quiet month.
  certbot:
    # Fixat pe o versiune anume: `latest` face ca o reconstrucție de azi și una de
    # peste șase luni să producă sisteme diferite din aceleași rețete.
    image: certbot/certbot:v5.8.0
    container_name: ronor-certbot
    profiles: ["edge"]
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done;"
    restart: unless-stopped
    logging: *default-logging


volumes:
  ronor-data:
  qdrant-data:
  qdrant-snapshots:
  redis-data:
  certbot-conf:
  certbot-www:
  energy-trading-data:
  energy-trading-state:

networks:
  default:
    name: ronor-net
    driver: bridge
