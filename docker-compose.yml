version: '3.9'

services:
  ronor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ronor-runtime
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL_PRIMARY=${OPENAI_MODEL_PRIMARY:-gpt-4o}
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-ronor-dev-key-change-in-production}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-60}
      - MODEL_FABRIC_STRATEGY=${MODEL_FABRIC_STRATEGY:-ems}
      - AUDIT_DB_PATH=/app/data/audit.db
      - MI9_POLICY_PATH=/app/src/governance/policies.yaml
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=${REDIS_ENABLED:-false}
      - DATABASE_URL=postgresql://ronor:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD trebuie definit in .env}@postgres:5432/ronor
      - DATABASE_ENABLED=${DATABASE_ENABLED:-false}
      # ---- R-Knowledge (MIP-014 / MIP-015) ----
      # Every variable defaults to the DISABLED or ABSENT value. A deployment that
      # sets none of them gets exactly the pre-MIP-014 runtime: no plane, no routes,
      # no store connection, no egress.
      - KNOWLEDGE_ENABLED=${KNOWLEDGE_ENABLED:-false}
      - KNOWLEDGE_ENVIRONMENT_CLASS=${KNOWLEDGE_ENVIRONMENT_CLASS:-development}
      - KNOWLEDGE_VECTOR_STORE=${KNOWLEDGE_VECTOR_STORE:-}
      - KNOWLEDGE_EMBEDDING_PROVIDER=${KNOWLEDGE_EMBEDDING_PROVIDER:-deterministic}
      - KNOWLEDGE_EMBEDDING_DIMENSIONS=${KNOWLEDGE_EMBEDDING_DIMENSIONS:-384}
      - KNOWLEDGE_EXTERNAL_EGRESS_AUTHORISED=${KNOWLEDGE_EXTERNAL_EGRESS_AUTHORISED:-false}
      - KNOWLEDGE_RAG_ENABLED=${KNOWLEDGE_RAG_ENABLED:-false}
      - KNOWLEDGE_SQLITE_PATH=/app/data/knowledge.db
      # Learned embedding provider. NO endpoint default: an unset endpoint refuses,
      # which is the point — a default endpoint would mean egress to a destination
      # nobody chose.
      - KNOWLEDGE_OPENAI_BASE_URL=${KNOWLEDGE_OPENAI_BASE_URL:-}
      - KNOWLEDGE_OPENAI_API_KEY=${KNOWLEDGE_OPENAI_API_KEY:-}
      - KNOWLEDGE_OPENAI_MODEL=${KNOWLEDGE_OPENAI_MODEL:-}
      # Qdrant. With the compose profile below active the in-network endpoint is
      # http://qdrant:6333; otherwise this is whatever external endpoint is supplied.
      - QDRANT_URL=${QDRANT_URL:-}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-ronor_knowledge}
      - KNOWLEDGE_QDRANT_AUTO_CREATE_COLLECTION=${KNOWLEDGE_QDRANT_AUTO_CREATE_COLLECTION:-false}
      - KNOWLEDGE_QDRANT_ENVIRONMENT_AUTHORISATION=${KNOWLEDGE_QDRANT_ENVIRONMENT_AUTHORISATION:-}
      # ------------------------------------------------------------------
      # RUNTIME ACTIVE (v0.5.0) — L0 · L1 · L3 · L7
      # ------------------------------------------------------------------
      #
      # NO DEFAULT on the two credential variables, deliberately. An unset key means
      # the runtime boots with no usable credential and refuses every authenticated
      # call with 401, which is the correct behaviour. A `:-ronor-dev-key` default
      # here would hand every `docker compose up` a working shared secret, and that
      # is precisely how a demonstration credential reaches production. Contrast
      # GATEWAY_API_KEY above, inherited from Core Active, which does exactly that
      # and is flagged in security_findings on /health when left at its default.
      - RONOR_ADMIN_API_KEY=${RONOR_ADMIN_API_KEY}
      - RONOR_API_KEYS=${RONOR_API_KEYS}
      - RONOR_RATE_LIMIT_RPM=${RONOR_RATE_LIMIT_RPM:-60}
      #
      # Provider credentials, each passed through with NO default. Absent means the
      # provider reports `key-absent`: the adapter is fully implemented, the router
      # excludes it at P0_CREDENTIAL_REALITY before scoring, and /health NAMES it. A
      # runtime that silently drops a provider is indistinguishable from one that
      # never had it configured.
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
      - RONOR_GATEWAY_BASE_URL=${RONOR_GATEWAY_BASE_URL:-}
      - RONOR_GATEWAY_API_KEY=${RONOR_GATEWAY_API_KEY:-}
      - RONOR_GATEWAY_MODELS=${RONOR_GATEWAY_MODELS:-}
      - RONOR_GATEWAY_HEADERS=${RONOR_GATEWAY_HEADERS:-}
      - OPENAI_NATIVE_API_KEY=${OPENAI_NATIVE_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_VERSION=${ANTHROPIC_VERSION:-2023-06-01}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - PERPLEXITY_BASE_URL=${PERPLEXITY_BASE_URL:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - KIMI_API_BASE=${KIMI_API_BASE:-}
      - KIMI_MODEL=${KIMI_MODEL:-kimi-k3}
      - RUNTIME_PROVIDER_TIMEOUT_MS=${RUNTIME_PROVIDER_TIMEOUT_MS:-120000}
      #
      # 6D router weights. Quality is discounted by each engine's MEASURED success
      # rate, so a degrading provider loses traffic without anyone editing a weight.
      - RUNTIME_WEIGHT_QUALITY=${RUNTIME_WEIGHT_QUALITY:-0.35}
      - RUNTIME_WEIGHT_COST=${RUNTIME_WEIGHT_COST:-0.25}
      - RUNTIME_WEIGHT_LATENCY=${RUNTIME_WEIGHT_LATENCY:-0.20}
      - RUNTIME_WEIGHT_RISK=${RUNTIME_WEIGHT_RISK:-0.10}
      - RUNTIME_WEIGHT_SOVEREIGNTY=${RUNTIME_WEIGHT_SOVEREIGNTY:-0.05}
      - RUNTIME_WEIGHT_EVIDENCE=${RUNTIME_WEIGHT_EVIDENCE:-0.05}
      - RUNTIME_TELEMETRY_WINDOW=${RUNTIME_TELEMETRY_WINDOW:-50}
      - RUNTIME_MAX_FALLBACK_ATTEMPTS=${RUNTIME_MAX_FALLBACK_ATTEMPTS:-3}
      #
      # Mission ceilings. A mission reaching the cost ceiling halts BETWEEN TASKS and
      # returns `partial` with its gaps declared, rather than completing silently
      # over budget.
      - RUNTIME_MISSION_MAX_COST_USD=${RUNTIME_MISSION_MAX_COST_USD:-2.00}
      - RUNTIME_MISSION_MAX_TASKS=${RUNTIME_MISSION_MAX_TASKS:-6}
      - RUNTIME_AGENT_TIMEOUT_MS=${RUNTIME_AGENT_TIMEOUT_MS:-180000}
      - RUNTIME_FETCH_MAX_BYTES=${RUNTIME_FETCH_MAX_BYTES:-2000000}
      #
      - RUNTIME_LEDGER_RETENTION_DAYS=${RUNTIME_LEDGER_RETENTION_DAYS:-0}
      - RUNTIME_CONSOLE_ENABLED=${RUNTIME_CONSOLE_ENABLED:-true}
    volumes:
      - ronor-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # Probes /api/runtime/health, NOT the legacy /health.
      #
      # /health answers 200 as soon as Express is listening. /api/runtime/health
      # answers 200 only when a generative provider is actually reachable and
      # returns 503 with status=degraded otherwise. The distinction matters for an
      # orchestrator: a container that is listening but cannot reach any engine will
      # accept traffic and fail every request, and a health check that calls that
      # healthy is a health check that hides the outage it exists to surface.
      #
      # 503 is treated as unhealthy on purpose. The runtime still serves the console
      # and the ledgers in that state, so an operator can read WHY it is degraded —
      # it is the load balancer that should stop sending it work.
      test:
        - CMD
        - node
        - -e
        - |
          require('http').get('http://127.0.0.1:3000/api/runtime/health', r => {
            let b = '';
            r.on('data', c => (b += c));
            r.on('end', () => {
              try {
                const j = JSON.parse(b);
                process.exit(r.statusCode === 200 && j.status === 'ready' ? 0 : 1);
              } catch (e) { process.exit(1); }
            });
          }).on('error', () => process.exit(1));
      interval: 30s
      timeout: 10s
      # 40s, not 15s. The boot path loads the MI9 policy, opens the audit chain,
      # seeds API keys, calibrates the router from persisted attempts and
      # initialises nine planes. Measured cold start is ~12s; a 15s window left no
      # margin, and a start_period that expires mid-boot makes an orchestrator
      # restart a container that was about to become healthy — a crash loop caused
      # entirely by the probe.
      start_period: 40s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ronor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ronor-postgres
    ports:
      # Legare implicita pe interfata locala. O gazda care are nevoie de acces
      # din reteaua privata pune POSTGRES_BIND_ADDR pe adresa acelei retele.
      - "${POSTGRES_BIND_ADDR:-127.0.0.1}:5432:5432"
    environment:
      - POSTGRES_USER=ronor
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD trebuie definit in .env}
      - POSTGRES_DB=ronor
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ronor"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Qdrant — R-Knowledge production vector store (MIP-015 requirement 4)
  # ------------------------------------------------------------------
  #
  # Behind an OPT-IN profile, so a plain `docker compose up` starts exactly the three
  # services it started before MIP-015. A vector database appearing unbidden in every
  # developer's stack is a resource cost and an attack surface nobody asked for, and
  # since the plane is disabled by default a running Qdrant would sit idle in most
  # deployments.
  #
  #   docker compose --profile knowledge up
  #
  # NOT VERIFIED AGAINST A RUNNING CONTAINER. docker was unavailable in the authoring
  # environment, so this manifest is reviewed but unexercised. It is declared as such
  # in the MIP-015 report rather than presented as tested.
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: ronor-qdrant
    profiles:
      - knowledge
    ports:
      # 6333 REST, 6334 gRPC. Bound to LOOPBACK deliberately: a store holding
      # INTERNAL-classified material should not be reachable from the host network by
      # default, and an operator who needs that can widen it knowingly.
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    environment:
      # Telemetry OFF. This is a SERVER-side setting, which is exactly why it belongs
      # here: the application cannot assert it on a server it does not operate, and a
      # test that claimed otherwise would be attesting to a configuration nobody had
      # verified.
      - QDRANT__TELEMETRY_DISABLED=true
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
      - QDRANT__LOG_LEVEL=${QDRANT_LOG_LEVEL:-INFO}
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # A TCP probe rather than an HTTP one: the image has no curl, and with an API
      # key set an unauthenticated HTTP probe would return 401 and be read as
      # unhealthy — a health check that fails precisely when the server is correctly
      # secured is worse than none.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

volumes:
  ronor-data:
  redis-data:
  postgres-data:
  qdrant-data:
