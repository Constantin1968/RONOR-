# MI9 Gate Policy — RONOR Build Week
#
# This is the declarative rule set consulted by the MI9 Gate on every
# decision request. It is intentionally simple and human-auditable.
#
# Semantics: the strictest verdict across all 9 gates wins.
#   allow < allow-with-cosign < escalate < block
#
# All impact thresholds map to Romanian energy operations (BESS 20 MWh,
# OPCOM DAM/ID/aFRR, EUR-denominated commercial flows). Domains follow the
# convention: <sector>.<asset>.<action>.

version: "2026.09.18"
description: >
  MI9 Gate policy. Two planes are governed by this single rule set.

  Energy plane: calibrated for a 20 MWh BESS in Romania trading on OPCOM
  DAM/ID/aFRR/balancing markets. All thresholds are derived from public 2026
  market analysis (max daily spread ~€168/MWh, average DAM ~€110/MWh, aFRR
  upward ~€9/MW/h).

  Development plane: the plane that modifies RONOR's own code. Its verdicts
  mirror the prohibitions already enforced in code at
  src/runtime/automation/policy.ts (ALWAYS_DENIED_ACTIONS), so that a single
  declarative source describes what both planes may do. Merge, release and
  deploy are blocked here because they are blocked there: they are the
  owner's decisions and cannot be delegated to an agent.

  Unknown domains are refused, not defaulted. See unknown_domain_tier.

gates:

  # -------------------------------------------------------------
  # Gate 1 — Sovereignty
  # -------------------------------------------------------------
  sovereignty:
    allowed_residencies: [eu, uk]
    required_for_jurisdictions:
      RO: [eu]
      EU: [eu]
      UK: [uk, eu]
      US: [eu, uk, us]
      OTHER: [eu, uk, us]

  # -------------------------------------------------------------
  # Gate 2 — Risk tier (EU AI Act mapping)
  # -------------------------------------------------------------
  risk_tier:
    # A domain absent from domain_tiers is refused rather than assumed benign.
    # Deny-by-default: an unclassified action has no established authority, so
    # the gate blocks it. Acting in a new domain therefore requires amending
    # this policy first, which is the intended constitutional route: authority
    # is granted by an explicit written rule, never by an omission.
    unknown_domain_tier: unacceptable
    domain_tiers:
      # --- Runtime surfaces (governance-bridge builds runtime.<surface>.<taskType>) ---
      # The leaf task type comes from a classifier and cannot be enumerated in
      # advance, so each surface is classified at family level and its leaves
      # inherit that tier. A surface absent from this list is refused.
      runtime.query:                   limited
      runtime.agent:                   limited
      runtime.tool:                    limited
      runtime.ingest:                  limited
      runtime.worker:                  high
      # --- Development plane (RONOR modifying its own code) ---
      development.repo.read:           minimal
      development.worktree.edit:       limited
      development.tests.run:           limited
      development.commit.local:        limited
      development.branch.create:       limited
      development.pr.prepare:          limited
      development.push.working_branch: high
      development.merge.main:          unacceptable
      development.release.publish:     unacceptable
      development.deploy.production:   unacceptable
      development.secrets.read:        unacceptable
      development.egress.external:     unacceptable
      development.canon.amend:         high
      development.host.configure:      high
      # --- Energy plane ---
      energy.bess.dispatch:            high
      energy.bess.bid:                 high
      energy.vpp.dispatch:             high
      energy.vpp.aggregate:            high
      energy.ancillary.fcr_bid:        high
      energy.ancillary.afrr_bid:       high
      energy.ancillary.balancing_bid:  high
      energy.forecast.load:            limited
      energy.forecast.price:           limited
      energy.observability.query:      minimal
      energy.reporting.generate:       minimal
    cosign_required_at_tier:  [high]
    escalation_required_at_tier: []

  # -------------------------------------------------------------
  # Gate 3 — Reversibility
  # -------------------------------------------------------------
  reversibility:
    # An irreversible action (e.g. accepted market bid past gate close)
    # must at minimum require human co-sign.
    irreversible_action_verdict: allow-with-cosign

  # -------------------------------------------------------------
  # Gate 4 — Impact magnitude
  # (Thresholds calibrated to a 20 MWh BESS trading in Romania)
  # -------------------------------------------------------------
  impact:
    cosign_thresholds:
      - unit: EUR
        value: 1000        # any decision moving >€1k requires co-sign
      - unit: MWh
        value: 5           # >5 MWh dispatch requires co-sign
      - unit: MW
        value: 10          # >10 MW capacity commitment requires co-sign
    escalation_thresholds:
      - unit: EUR
        value: 10000       # >€10k escalates to a human operator
      - unit: MWh
        value: 15
      - unit: MW
        value: 30
    block_thresholds:
      - unit: EUR
        value: 100000      # >€100k is blocked outright without policy update
      - unit: MWh
        value: 40          # exceeds full BESS energy capacity → obviously wrong
      - unit: MW
        value: 100

  # -------------------------------------------------------------
  # Gate 5 — Confidence
  # -------------------------------------------------------------
  confidence:
    minimum_autonomous: 0.85       # >= this → allow autonomously
    minimum_cosign:     0.55       # >= this and < autonomous → co-sign
    # anything below minimum_cosign → escalate

  # -------------------------------------------------------------
  # Gate 6 — Evidence
  # -------------------------------------------------------------
  evidence:
    min_source_count: 2
    max_data_age_ms: 900000        # 15 minutes — DAM/ID freshness horizon
    consensus_required_for_domains:
      - energy.bess.dispatch
      - energy.vpp.dispatch
      - energy.ancillary.fcr_bid
      - energy.ancillary.afrr_bid

  # -------------------------------------------------------------
  # Gate 7 — Policy compliance (domain-specific rules)
  # -------------------------------------------------------------
  policy_compliance:
    domain_specific_rules:
      energy.bess.dispatch:
        - "ANRE Order 46/2024: state-of-charge visible to TSO"
        - "EU AI Act high-risk logging retention: 6 months minimum"
        - "OPCOM balancing rules: bid volumes rounded to 0.1 MW"
        - "Degradation-aware: no more than 1.5 equivalent full cycles per day without cosign"
      energy.bess.bid:
        - "ANRE Order 46/2024 §12: bid transparency"
        - "OPCOM DAM gate close: 12:00 CET day D-1"
      energy.vpp.dispatch:
        - "ANRE VPP framework 2026: aggregator liability chain declared"
        - "Reliability-adjusted bidding: probability of delivery attached"
      energy.ancillary.fcr_bid:
        - "ENTSO-E FCR technical requirements (SO GL Article 154)"
        - "Symmetric ±: bid must be simultaneously up and down"
      energy.ancillary.afrr_bid:
        - "ENTSO-E aFRR technical requirements (SO GL Article 158)"
        - "aFRR activation lead time: <=30 seconds"

  # -------------------------------------------------------------
  # Gate 8 — Rate limits (per hour, in-memory sliding window)
  # -------------------------------------------------------------
  rate_limits:
    autonomous_per_hour: 12         # max fully-autonomous decisions per hour
    cosign_per_hour:     24         # max co-sign decisions per hour

  # -------------------------------------------------------------
  # Gate 9 — Fallback plan
  # -------------------------------------------------------------
  fallback:
    required_for_domains:
      - energy.bess.dispatch
      - energy.vpp.dispatch
      - energy.ancillary.fcr_bid
      - energy.ancillary.afrr_bid
      - energy.ancillary.balancing_bid
